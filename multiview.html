<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Grid | Multiview</title>
    <link rel="stylesheet" href="index.css?v=19">

    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="stream-in-colorado.jpg">
</head>
<body class="mv-body">
    <header class="mv-header glass">
        <button onclick="window.location.href='index.html'" class="back-btn" title="Torna indietro">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </button>

        <div class="mv-heading">
            <span class="mv-title">Multiview 🧪</span>
            <span class="mv-sub" id="mv-range">1 – 100</span>
        </div>

        <nav class="mv-pages" id="mv-pages" aria-label="Pagine"></nav>

        <div class="mv-stats glass" id="mv-stats">0 / 10 live</div>
    </header>

    <div class="mv-alert" id="mv-alert" hidden>
        <span><b>Sorgente gomstream.xyz non raggiungibile</b> — <span id="mv-alert-count">0</span> preview offline</span>
        <button type="button" class="mv-alert-btn" id="mv-alert-retry">Riprova ora</button>
    </div>

    <main class="mv-grid" id="mv-grid"></main>

    <div class="mv-hint" id="mv-hint">Clicca un'anteprima per aprirla a tutto schermo · <b>Esc</b> per uscire</div>

    <script>
        // ============================================================
        //  MULTIVIEW - 999 stream divisi in 100 pagine da 10
        //  Massimo 10 preview in diretta contemporaneamente:
        //  le altre si caricano man mano che si scorre.
        // ============================================================
        const TOTAL = 999;
        const PER_PAGE = 10;
        const PAGE_COUNT = Math.ceil(TOTAL / PER_PAGE); // 100
        const MAX_LIVE = 10;
        const BASE_URL = 'https://gomstream.xyz/live/stream-';

        // Salute della sorgente: se non risponde non si vede l'iframe
        // (niente pagine di errore del browser dentro la tile).
        const PROBE_TIMEOUT = 6000;  // ms - attesa max del test di raggiungibilità
        const RETRY_DELAY = 25000;   // ms - ripristino automatico quando è giù
        const REVEAL_TIMEOUT = 2500; // ms - dopo questo l'anteprima si mostra comunque
        const MOUNT_CONCURRENCY = 3; // player montati in contemporanea
        const MOUNT_GAP = 350;       // ms - pausa fra un montaggio e l'altro

        const grid = document.getElementById('mv-grid');
        const pagesNav = document.getElementById('mv-pages');
        const rangeEl = document.getElementById('mv-range');
        const statsEl = document.getElementById('mv-stats');
        const hintEl = document.getElementById('mv-hint');
        const alertEl = document.getElementById('mv-alert');
        const alertRetry = document.getElementById('mv-alert-retry');
        const alertCount = document.getElementById('mv-alert-count');

        // Stato
        let page = 1;
        let observer = null;
        let retryTimer = null;
        let sourceUp = null;      // null = ignoto, true/false dopo il test
        let probeFailures = 0;    // fallimenti consecutivi del test
        let probeInFlight = false;
        let mountActive = 0;      // montaggi in corso
        const mountQueue = [];    // tile in attesa di montaggio
        const visible = new Map();   // tile -> ratio di visibilita'
        const liveTiles = new Set(); // tile con iframe montato

        // --- Utility -------------------------------------------------
        function streamUrl(n) {
            return `${BASE_URL}${n}.php`;
        }

        function pageRange(p) {
            const start = (p - 1) * PER_PAGE + 1;
            const end = Math.min(p * PER_PAGE, TOTAL);
            return [start, end];
        }

        function clampPage(p) {
            if (!p || isNaN(p)) return 1;
            return Math.min(Math.max(parseInt(p, 10), 1), PAGE_COUNT);
        }

        function readParams() {
            const params = new URLSearchParams(window.location.search);
            page = clampPage(params.get('p'));
        }

        function writeParams() {
            try {
                const url = new URL(window.location.href);
                url.searchParams.set('p', page);
                history.replaceState(null, '', url.toString());
            } catch (e) { /* file:// fallback */ }
        }

        // --- Paginazione ---------------------------------------------
        function buildPages() {
            pagesNav.innerHTML = '';

            const prev = document.createElement('button');
            prev.className = 'mv-page mv-arrow';
            prev.type = 'button';
            prev.innerHTML = '&lsaquo;';
            prev.title = 'Pagina precedente';
            prev.disabled = page <= 1;
            prev.addEventListener('click', () => goToPage(page - 1));
            pagesNav.appendChild(prev);

            // Con 100 pagine non entrano tutti i numeri in header:
            // si mostrano prima, ultima e corrente ±2, con i puntini di salto.
            const items = [1, PAGE_COUNT];
            for (let p = page - 2; p <= page + 2; p++) {
                if (p >= 1 && p <= PAGE_COUNT) items.push(p);
            }
            const unique = [...new Set(items)].sort((a, b) => a - b);

            let last = 0;
            unique.forEach(p => {
                if (p - last > 1) {
                    const dots = document.createElement('span');
                    dots.className = 'mv-page mv-dots';
                    dots.textContent = '…';
                    dots.title = `Stream ${last + 1} – ${p - 1}`;
                    pagesNav.appendChild(dots);
                }

                const [s, e] = pageRange(p);
                const btn = document.createElement('button');
                btn.className = 'mv-page' + (p === page ? ' active' : '');
                btn.type = 'button';
                btn.textContent = p;
                btn.title = `Stream ${s} – ${e}`;
                btn.addEventListener('click', () => goToPage(p));
                pagesNav.appendChild(btn);
                last = p;
            });

            const next = document.createElement('button');
            next.className = 'mv-page mv-arrow';
            next.type = 'button';
            next.innerHTML = '&rsaquo;';
            next.title = 'Pagina successiva';
            next.disabled = page >= PAGE_COUNT;
            next.addEventListener('click', () => goToPage(page + 1));
            pagesNav.appendChild(next);
        }

        function goToPage(p) {
            p = clampPage(p);
            if (p === page) return;
            page = p;
            writeParams();
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- Sorgente -------------------------------------------------
        // Tutti gli stream arrivano dallo stesso host: interrogare le 10 tile
        // singolarmente lo mette in saturazione e smettono di caricare anche
        // i player che funzionerebbero. Si fa invece UN solo test per la
        // sorgente, prima di montare qualunque cosa.
        function probe() {
            // da file:// fetch non è disponibile: si salta il controllo
            if (location.protocol === 'file:') return Promise.resolve({ ok: true, ms: 0 });

            const t0 = Date.now();
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), PROBE_TIMEOUT);
            return fetch(streamUrl(pageRange(page)[0]), {
                method: 'HEAD',
                mode: 'no-cors',
                cache: 'no-store',
                credentials: 'omit',
                signal: ctrl.signal
            })
                .then(() => { clearTimeout(timer); return { ok: true, ms: Date.now() - t0 }; })
                .catch(() => { clearTimeout(timer); return { ok: false, ms: Date.now() - t0 }; });
        }

        async function ensureSource() {
            if (sourceUp === true) return true;
            const res = await probe();
            if (res.ok) {
                sourceUp = true;
                probeFailures = 0;
                return true;
            }
            probeFailures++;
            // un rifiuto secco è inequivocabile e basta un tentativo;
            // un timeout può essere solo congestione: meglio due di fila.
            if (res.ms < 1500 || probeFailures >= 2) sourceUp = false;
            return false;
        }

        function ensureSourceThen(fn) {
            if (probeInFlight) return;
            probeInFlight = true;
            ensureSource().then(ok => {
                probeInFlight = false;
                if (ok) fn();
                else markAllFailed();
            });
        }

        function markAllFailed() {
            grid.querySelectorAll('.mv-tile').forEach(t => {
                if (!t.querySelector('.mv-frame')) markFailed(t);
            });
        }

        // --- Montaggio iframe ----------------------------------------
        // Coda con concorrenza limitata: montare 10 player pesanti tutti
        // insieme satura sia il browser sia la sorgente, e ogni player
        // impiega poi molto di più ad avviarsi.
        function mount(tile) {
            if (tile.classList.contains('failed')) return; // in attesa di retry
            if (tile.dataset.queued === '1') return;       // già in coda o montata
            if (tile.querySelector('.mv-frame')) return;
            tile.dataset.queued = '1';
            mountQueue.push(tile);
            pumpQueue();
        }

        function pumpQueue() {
            while (mountActive < MOUNT_CONCURRENCY && mountQueue.length) {
                const tile = mountQueue.shift();
                if (!tile.isConnected || tile.classList.contains('failed') || tile.querySelector('.mv-frame')) continue;
                mountActive++;
                mountFrame(tile);
                setTimeout(() => {
                    mountActive--;
                    pumpQueue();
                }, MOUNT_GAP);
            }
        }

        function mountFrame(tile) {
            if (tile.querySelector('iframe')) return;

            const n = tile.dataset.n;
            const frame = document.createElement('iframe');
            frame.className = 'mv-frame';
            frame.src = streamUrl(n);
            frame.title = `Stream ${n}`;
            frame.loading = 'lazy';
            frame.referrerPolicy = 'no-referrer'; // alcuni host rifiutano con referer
            frame.setAttribute('allow', 'autoplay; encrypted-media; fullscreen; picture-in-picture');
            frame.setAttribute('allowfullscreen', '');

            // Il documento dei player in diretta non finisce mai di caricare,
            // quindi l'evento 'load' può non arrivare: dopo REVEAL_TIMEOUT
            // l'anteprima viene mostrata comunque.
            let revealed = false;
            const reveal = () => {
                if (revealed) return;
                revealed = true;
                clearTimeout(revealTimer);
                tile.classList.remove('failed');
                tile.classList.add('loaded');
                updateStats();
            };
            const revealTimer = setTimeout(reveal, REVEAL_TIMEOUT);
            frame.addEventListener('load', reveal);

            tile.appendChild(frame);
            liveTiles.add(tile);
            updateStats();
        }

        function markFailed(tile) {
            const frame = tile.querySelector('iframe');
            if (frame) frame.remove();
            tile.classList.remove('loaded');
            liveTiles.delete(tile);
            tile.classList.add('failed');
            updateStats();
        }

        function retryTile(tile) {
            tile.classList.remove('failed');
            tile.dataset.queued = '0';
            mount(tile);
        }

        function retryFailed() {
            // si riparte da un controllo della sorgente: se è ancora giù
            // non ha senso montare 10 iframe che falliscono tutti.
            // (probeFailures NON si azzera: così dopo due cicli la sorgente
            // viene dichiarata giù e syncLive smette di interrogarla)
            sourceUp = null;
            mountQueue.length = 0;
            grid.querySelectorAll('.mv-tile.failed').forEach(t => {
                t.classList.remove('failed');
                t.dataset.queued = '0';
            });
            ensureSourceThen(syncLive);
        }

        // Con 10 tile per pagina una volta caricate restano montate:
        // prima venivano smontate a ogni scroll e l'intero player
        // veniva ricaricato ogni volta che si muoveva la pagina.
        function syncLive() {
            if (sourceUp === false) return; // sorgente giù: l'avviso è già in pagina
            if (sourceUp === null) { ensureSourceThen(syncLive); return; }

            const fsTile = document.fullscreenElement;
            const candidates = [];
            visible.forEach((ratio, tile) => {
                if (!tile.isConnected) return;
                candidates.push([tile, ratio]);
            });

            candidates.sort((a, b) => {
                if (b[1] !== a[1]) return b[1] - a[1];
                return parseInt(a[0].dataset.n, 10) - parseInt(b[0].dataset.n, 10);
            });

            candidates.slice(0, MAX_LIVE).forEach(c => mount(c[0]));
            if (fsTile && fsTile.classList.contains('mv-tile')) mount(fsTile);
            updateStats();
        }

        // --- Ricerca ---------------------------------------------------
        function createTile(n) {
            const tile = document.createElement('div');
            tile.className = 'mv-tile fade-in';
            tile.dataset.n = n;
            tile.innerHTML = `
                <div class="mv-ph">
                    <span class="mv-num">#${n}</span>
                    <span class="mv-live"><i></i>LIVE</span>
                </div>
                <div class="mv-err">
                    <span class="mv-err-t">Sorgente non disponibile</span>
                    <span class="mv-err-s">Stream #${n}</span>
                    <button class="mv-err-btn" type="button">Riprova</button>
                </div>
                <div class="mv-overlay" title="Apri a tutto schermo">
                    <span class="mv-ov-num">#${n}</span>
                    <span class="mv-ov-ico">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                    </span>
                </div>
                <button class="mv-exit" type="button" title="Esci da tutto schermo">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>`;

            tile.querySelector('.mv-overlay').addEventListener('click', ev => {
                ev.stopPropagation();
                goFullscreen(tile);
            });
            tile.querySelector('.mv-exit').addEventListener('click', ev => {
                ev.stopPropagation();
                exitFullscreen();
            });
            tile.querySelector('.mv-err-btn').addEventListener('click', ev => {
                ev.stopPropagation();
                retryTile(tile);
            });

            return tile;
        }

        function render() {
            const [start, end] = pageRange(page);
            rangeEl.textContent = `${start} – ${end}`;

            // ripulizia
            if (observer) observer.disconnect();
            visible.clear();
            liveTiles.forEach(t => t.classList.remove('loaded'));
            liveTiles.clear();
            grid.innerHTML = '';

            const frag = document.createDocumentFragment();
            for (let n = start; n <= end; n++) frag.appendChild(createTile(n));
            grid.appendChild(frag);

            observer = new IntersectionObserver(onIntersect, {
                root: null,
                rootMargin: '120px 0px',
                threshold: [0, 0.25, 0.5, 0.75, 1]
            });
            grid.querySelectorAll('.mv-tile').forEach(t => observer.observe(t));

            buildPages();
            updateStats();
        }

        function onIntersect(entries) {
            entries.forEach(en => {
                if (en.isIntersecting) {
                    visible.set(en.target, en.intersectionRatio || 0.01);
                } else {
                    visible.delete(en.target);
                }
            });
            syncLive();
        }

        function updateStats() {
            const offline = grid.querySelectorAll('.mv-tile.failed').length;
            statsEl.classList.toggle('mv-down', offline > 0);
            statsEl.textContent = offline
                ? `${liveTiles.size} / ${MAX_LIVE} live · ${offline} offline`
                : `${liveTiles.size} / ${MAX_LIVE} live`;
            syncAlert(offline);
        }

        // Avviso in pagina quando la sorgente non risponde,
        // con ripristino automatico finché non torna online.
        function syncAlert(offline) {
            if (!alertEl) return;
            if (alertCount) alertCount.textContent = offline;
            alertEl.hidden = offline === 0;

            if (offline > 0 && retryTimer === null) {
                retryTimer = setInterval(retryFailed, RETRY_DELAY);
            } else if (offline === 0 && retryTimer !== null) {
                clearInterval(retryTimer);
                retryTimer = null;
            }
        }

        // --- Fullscreen ----------------------------------------------
        function hideHint() {
            if (hintEl) hintEl.classList.add('mv-hint-fade');
        }

        function goFullscreen(tile) {
            hideHint();
            const req = tile.requestFullscreen || tile.webkitRequestFullscreen;
            if (req) {
                try {
                    const res = req.call(tile);
                    if (res && typeof res.catch === 'function') res.catch(() => fallbackFullscreen(tile));
                    return;
                } catch (e) {
                    fallbackFullscreen(tile);
                    return;
                }
            }
            fallbackFullscreen(tile);
        }

        function fallbackFullscreen(tile) {
            tile.classList.add('fs-fixed');
            document.body.style.overflow = 'hidden';
        }

        function exitFullscreen() {
            if (document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
            document.querySelectorAll('.mv-tile.fs-fixed').forEach(t => t.classList.remove('fs-fixed'));
            document.body.style.overflow = '';
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.querySelectorAll('.mv-tile.fs-fixed').forEach(t => t.classList.remove('fs-fixed'));
                document.body.style.overflow = '';
            }
            syncLive();
        });
        document.addEventListener('webkitfullscreenchange', () => {
            if (!document.webkitFullscreenElement) {
                document.querySelectorAll('.mv-tile.fs-fixed').forEach(t => t.classList.remove('fs-fixed'));
                document.body.style.overflow = '';
            }
            syncLive();
        });

        // Tastiera: Esc per uscire da tutto schermo
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') exitFullscreen();
        });

        // --- Init -----------------------------------------------------
        readParams();
        writeParams();
        render();

        if (alertRetry) alertRetry.addEventListener('click', retryFailed);

        // nasconde il suggerimento se non viene usato
        setTimeout(hideHint, 20000);
    </script>
</body>
</html>
